<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AdapTier — From field device to NATS JetStream, in minutes</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --bg: #1a1e24;
    --bg-deep: #14171c;
    --surface: #21262d;
    --surface-raised: #282e38;
    --surface-sunken: #1d2127;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --border-muted: rgba(255, 255, 255, 0.05);
    --text: #cdd6e0;
    --text-strong: #e8edf2;
    --text-muted: #8892a4;
    --text-faint: #4a5568;
    --accent: #f5a623;
    --accent-dim: rgba(245, 166, 35, 0.12);
    --accent-bright: #ffb83d;
    --teal: #4ec9b0;
    --pink: #e879a0;
    --green: #3fb950;
    --blue: #58a6ff;
    --red: #f85149;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  ::selection { background: var(--accent); color: #1a1e24; }

  /* ------- Page-wide grid background ------- */
  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.045) 1px, transparent 0);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 80%);
    z-index: 0;
  }

  /* ------- Layout containers ------- */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px;
    position: relative;
    z-index: 1;
  }

  /* ------- Section labels ------- */
  .label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-faint);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .label .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }

  /* ------- Status dot variants ------- */
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    display: inline-block;
    background: var(--green);
    box-shadow: 0 0 8px currentColor;
    color: var(--green);
  }
  .status-dot.amber { background: var(--accent); color: var(--accent); }
  .status-dot.teal { background: var(--teal); color: var(--teal); }

  /* ------- Pills ------- */
  .pill {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(78, 201, 176, 0.08);
    color: var(--teal);
    border: 1px solid rgba(78, 201, 176, 0.2);
    letter-spacing: 0.04em;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .pill.pink { background: rgba(232, 121, 160, 0.08); color: var(--pink); border-color: rgba(232, 121, 160, 0.2); }
  .pill.amber { background: var(--accent-dim); color: var(--accent); border-color: rgba(245, 166, 35, 0.25); }
  .pill.muted { background: rgba(255,255,255,0.04); color: var(--text-muted); border-color: var(--border); }

  /* ------- Buttons ------- */
  .btn {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 4px;
    border: 1px solid transparent;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 120ms ease, transform 120ms ease, border-color 120ms ease;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--accent);
    color: #1a1410;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-bright); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border-color: var(--border-strong);
  }
  .btn-ghost:hover { background: var(--surface); border-color: var(--text-muted); }
  .btn-text {
    background: transparent;
    color: var(--text);
    padding: 10px 0;
  }
  .btn-text:hover { color: var(--accent); }

  /* =============== NAV =============== */
  nav.top {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(20, 23, 28, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: 58px;
  }
  nav.top .container {
    display: flex;
    align-items: center;
    height: 58px;
    gap: 32px;
  }
  .logo {
    font-family: var(--mono);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--text-strong);
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .logo .status-dot { width: 7px; height: 7px; }
  .logo .ver {
    font-weight: 400;
    color: var(--text-faint);
    font-size: 11px;
    margin-left: 4px;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-left: auto;
  }
  .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 400;
  }
  .nav-links a:hover { color: var(--text-strong); }
  .nav-cta { margin-left: 8px; }

  /* =============== HERO =============== */
  .hero {
    position: relative;
    padding: 80px 0 100px;
    overflow: hidden;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 64px;
    align-items: center;
  }
  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px 6px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 100px;
    background: var(--surface-sunken);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    margin-bottom: 28px;
  }
  .hero-eyebrow .status-dot { width: 7px; height: 7px; }
  h1.hero-title {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(40px, 5.4vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 24px;
    color: var(--text-strong);
  }
  h1.hero-title .accent { color: var(--accent); }
  h1.hero-title .dim { color: var(--text-muted); }
  h1.hero-title .arrow {
    display: inline-block;
    font-family: var(--mono);
    color: var(--text-faint);
    font-weight: 400;
    margin: 0 0.15em;
  }
  .hero-sub {
    font-size: 17px;
    line-height: 1.55;
    color: var(--text-muted);
    max-width: 540px;
    margin: 0 0 36px;
  }
  .hero-sub strong { color: var(--text); font-weight: 500; }
  .hero-cta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hero-meta {
    margin-top: 36px;
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
  }
  .hero-meta-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .hero-meta-item .v {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    color: var(--text-strong);
  }
  .hero-meta-item .v .unit { color: var(--text-muted); font-weight: 400; font-size: 13px; }
  .hero-meta-item .k {
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-faint);
  }

  /* Hero visual: stacked screenshots */
  .hero-visual {
    position: relative;
    height: 560px;
  }
  .panel-card {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 12px 24px -8px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .panel-chrome {
    height: 32px;
    background: var(--surface-raised);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .panel-chrome .dots {
    display: inline-flex;
    gap: 6px;
    margin-right: 4px;
  }
  .panel-chrome .dots i {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
  }
  .panel-chrome .title { color: var(--text-muted); }
  .panel-chrome .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  .hero-shot-back {
    top: 0;
    right: -40px;
    width: 540px;
    height: 360px;
    transform: rotate(-1deg);
    z-index: 1;
  }
  .hero-shot-back img {
    width: 100%; height: calc(100% - 32px);
    object-fit: cover;
    object-position: top left;
    display: block;
  }
  .hero-shot-front {
    bottom: 0;
    left: -20px;
    width: 480px;
    height: 320px;
    transform: rotate(1.2deg);
    z-index: 2;
  }
  .hero-shot-front img {
    width: 100%; height: calc(100% - 32px);
    object-fit: cover;
    object-position: top left;
    display: block;
  }

  /* Live debug overlay floating in hero */
  .hero-stream {
    position: absolute;
    right: -10px;
    bottom: 30px;
    z-index: 3;
    width: 320px;
    background: rgba(20, 23, 28, 0.94);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
    overflow: hidden;
    transform: rotate(-0.5deg);
  }
  .hero-stream .panel-chrome { height: 28px; font-size: 10px; }
  .hero-stream .stream-rows {
    height: 168px;
    overflow: hidden;
    position: relative;
    font-family: var(--mono);
    font-size: 11px;
  }

  /* =============== PROTOCOL BELT =============== */
  .belt {
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--surface-sunken);
    padding: 32px 0;
    position: relative;
    overflow: hidden;
  }
  .belt-label {
    text-align: center;
    margin-bottom: 20px;
  }
  .marquee {
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%);
  }
  .marquee-track {
    display: flex;
    width: max-content;
    gap: 16px;
    animation: scroll 40s linear infinite;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .protocol-chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .protocol-chip .status-dot { width: 6px; height: 6px; }

  /* =============== LIVE DEBUG SHOWCASE =============== */
  .showcase {
    padding: 120px 0;
    position: relative;
  }
  .showcase-grid {
    display: grid;
    grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
    gap: 80px;
    align-items: center;
  }
  .showcase-text h2 {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(32px, 3.6vw, 46px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 18px 0 20px;
    color: var(--text-strong);
  }
  .showcase-text h2 .teal { color: var(--teal); }
  .showcase-text p {
    font-size: 16px;
    color: var(--text-muted);
    margin: 0 0 24px;
    line-height: 1.6;
    max-width: 480px;
  }
  .showcase-bullets {
    list-style: none;
    padding: 0;
    margin: 28px 0 0;
    display: grid;
    gap: 14px;
  }
  .showcase-bullets li {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    font-size: 14px;
    color: var(--text);
  }
  .showcase-bullets li .num {
    font-family: var(--mono);
    color: var(--accent);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.06em;
    min-width: 28px;
    padding-top: 2px;
  }
  .showcase-bullets li .desc { color: var(--text-muted); font-size: 13.5px; }
  .showcase-bullets li .desc strong { color: var(--text-strong); font-weight: 500; }

  /* The big debug panel */
  .debug-panel {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    overflow: hidden;
    box-shadow:
      0 40px 80px -20px rgba(0,0,0,0.7),
      0 16px 32px -10px rgba(0,0,0,0.5);
  }
  .debug-panel .panel-chrome {
    height: 38px;
    font-size: 11px;
  }
  .debug-tabs {
    display: flex;
    gap: 0;
    background: var(--surface-sunken);
    border-bottom: 1px solid var(--border);
    padding: 0;
  }
  .debug-tab {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-faint);
    padding: 12px 18px;
    border-right: 1px solid var(--border);
    cursor: default;
  }
  .debug-tab.active {
    color: var(--text);
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    margin-bottom: -1px;
  }
  .debug-body {
    display: grid;
    grid-template-columns: 200px 1fr;
    min-height: 380px;
  }
  .debug-tree {
    background: var(--surface-sunken);
    border-right: 1px solid var(--border);
    padding: 12px 0;
    font-family: var(--mono);
    font-size: 12px;
  }
  .debug-tree .tree-section {
    color: var(--text-faint);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.14em;
    padding: 10px 16px 6px;
  }
  .debug-tree .tree-row {
    padding: 5px 16px 5px 28px;
    color: var(--text-muted);
    cursor: default;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .debug-tree .tree-row.selected {
    background: rgba(88, 166, 255, 0.12);
    color: var(--text);
    border-left: 2px solid var(--blue);
    padding-left: 26px;
  }
  .debug-tree .tree-row::before {
    content: '▸';
    color: var(--text-faint);
    font-size: 10px;
  }
  .debug-tree .tree-row.expanded::before { content: '▾'; }

  .debug-stream {
    overflow: hidden;
    position: relative;
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--surface);
  }

  /* =============== PLC SPOTLIGHT =============== */
  .plc {
    padding: 120px 0;
    border-top: 1px solid var(--border);
    background:
      radial-gradient(ellipse 800px 400px at 80% 0%, rgba(245, 166, 35, 0.04), transparent 60%),
      var(--bg);
    position: relative;
  }
  .plc-head {
    max-width: 760px;
    margin-bottom: 56px;
  }
  .plc-head h2 {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(32px, 3.6vw, 46px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 18px 0 18px;
    color: var(--text-strong);
  }
  .plc-head h2 .pink { color: var(--pink); }
  .plc-head p {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-muted);
    margin: 0;
    max-width: 620px;
  }

  /* Annotated screenshot */
  .plc-shot-wrap {
    position: relative;
    margin: 0 0 64px;
  }
  .plc-shot {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    overflow: hidden;
    box-shadow:
      0 50px 100px -30px rgba(0,0,0,0.7),
      0 20px 40px -10px rgba(0,0,0,0.5);
  }
  .plc-shot .panel-chrome {
    height: 38px;
    font-size: 11px;
  }
  .plc-shot .lang-tabs {
    display: flex;
    background: var(--surface-sunken);
    border-bottom: 1px solid var(--border);
  }
  .plc-shot .lang-tab {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-faint);
    padding: 10px 16px;
    border-right: 1px solid var(--border);
  }
  .plc-shot .lang-tab.active {
    color: var(--accent);
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    margin-bottom: -1px;
  }
  .plc-shot img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: cover;
    object-position: top left;
  }

  /* Callouts on the screenshot */
  .callout {
    position: absolute;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
  }
  .callout .pin {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: rgba(245, 166, 35, 0.18);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.08), 0 0 18px rgba(245, 166, 35, 0.3);
  }
  .callout .label-text {
    background: rgba(20, 23, 28, 0.92);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .callout .label-text .accent { color: var(--accent); }
  .callout .label-text .teal { color: var(--teal); }
  .callout .label-text .pink { color: var(--pink); }

  .callout-1 { top: 14%; left: 4%; }
  .callout-2 { top: 32%; right: 6%; flex-direction: row-reverse; }
  .callout-3 { bottom: 22%; left: 12%; }
  .callout-4 { bottom: 8%; right: 14%; flex-direction: row-reverse; }

  /* PLC feature pills grid */
  .plc-features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }
  .plc-feature {
    padding: 24px 24px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .plc-feature:nth-child(3n) { border-right: none; }
  .plc-feature:nth-last-child(-n+3) { border-bottom: none; }
  .plc-feature .pf-label {
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-faint);
  }
  .plc-feature .pf-value {
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 600;
    color: var(--text-strong);
    letter-spacing: -0.01em;
  }
  .plc-feature .pf-value .accent { color: var(--accent); }
  .plc-feature .pf-value .teal { color: var(--teal); }
  .plc-feature .pf-value .pink { color: var(--pink); }
  .plc-feature .pf-desc {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.5;
  }

  @media (max-width: 1100px) {
    .callout-1, .callout-2, .callout-3, .callout-4 { display: none; }
    .plc-features { grid-template-columns: repeat(2, 1fr); }
    .plc-feature:nth-child(3n) { border-right: 1px solid var(--border); }
    .plc-feature:nth-child(2n) { border-right: none; }
    .plc-feature:nth-last-child(-n+3) { border-bottom: 1px solid var(--border); }
    .plc-feature:nth-last-child(-n+2) { border-bottom: none; }
  }
  @media (max-width: 720px) {
    .plc { padding: 64px 0; }
    .plc-features { grid-template-columns: 1fr; }
    .plc-feature { border-right: none !important; border-bottom: 1px solid var(--border) !important; }
    .plc-feature:last-child { border-bottom: none !important; }
  }

  /* =============== HMI =============== */
  .hmi {
    padding: 120px 0;
    border-top: 1px solid var(--border);
    background:
      radial-gradient(ellipse 800px 400px at 20% 0%, rgba(78, 201, 176, 0.04), transparent 60%),
      var(--bg);
    position: relative;
  }
  .hmi-head {
    max-width: 760px;
    margin-bottom: 56px;
  }
  .hmi-head h2 {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(32px, 3.6vw, 46px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 18px 0 18px;
    color: var(--text-strong);
  }
  .hmi-head h2 .teal { color: var(--teal); }
  .hmi-head p {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-muted);
    margin: 0;
    max-width: 620px;
  }

  .hmi-hero {
    position: relative;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .hmi-hero .panel-chrome { height: 38px; font-size: 11px; }
  .hmi-tabs {
    display: flex;
    background: var(--surface-sunken);
    border-bottom: 1px solid var(--border);
  }
  .hmi-tab {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-faint);
    padding: 12px 18px;
    border-right: 1px solid var(--border);
    cursor: pointer;
    transition: color 120ms ease, background 120ms ease;
  }
  .hmi-tab:hover { color: var(--text); }
  .hmi-tab.active {
    color: var(--teal);
    background: var(--surface);
    border-bottom: 2px solid var(--teal);
    margin-bottom: -1px;
  }
  .hmi-canvas {
    background: var(--bg-deep);
    padding: 0;
  }
  .ahu-svg {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 900 / 360;
  }

  .hmi-thumbs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .hmi-thumb {
    position: relative;
    overflow: hidden;
    height: 220px;
    display: flex;
    flex-direction: column;
  }
  .thumb-chrome {
    height: 30px !important;
    font-size: 10px !important;
  }
  .thumb-body {
    flex: 1;
    overflow: hidden;
  }
  .thumb-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    height: 100%;
  }
  .zone-cell {
    border: 1px solid;
    border-radius: 4px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: var(--mono);
  }
  .zc-name { font-size: 9px; color: var(--text-faint); letter-spacing: 0.14em; }
  .zc-t { font-size: 16px; font-weight: 600; }
  .zc-sp { font-size: 9px; color: var(--text-muted); }

  @media (max-width: 1100px) {
    .hmi-thumbs { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .hmi { padding: 64px 0; }
    .hmi-thumbs { grid-template-columns: 1fr; }
    .hmi-thumb { height: 200px; }
    .hmi-tab { padding: 10px 12px; font-size: 10px; }
  }

  /* =============== FINAL CTA =============== */
  .final-cta {
    padding: 120px 0;
    text-align: center;
    position: relative;
    border-top: 1px solid var(--border);
    background:
      radial-gradient(ellipse 600px 300px at 50% 50%, rgba(245, 166, 35, 0.08), transparent 70%),
      var(--bg);
  }
  .final-cta h2 {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(30px, 4vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 0 0 18px;
    color: var(--text-strong);
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }
  .final-cta p {
    color: var(--text-muted);
    font-size: 16px;
    max-width: 560px;
    margin: 0 auto 36px;
  }
  .final-cta .cta-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* =============== FOOTER =============== */
  footer {
    border-top: 1px solid var(--border);
    background: var(--surface-sunken);
    padding: 32px 0;
  }
  footer .container {
    display: flex;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
  }
  .foot-logo { display: flex; align-items: center; gap: 12px; }
  .foot-tag { color: var(--text-faint); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }
  .foot-links { display: flex; gap: 24px; margin-left: auto; }
  .foot-links a { color: var(--text-muted); text-decoration: none; font-size: 13px; }
  .foot-links a:hover { color: var(--text); }
  .foot-copy { color: var(--text-faint); font-family: var(--mono); font-size: 11px; }

  /* =============== RESPONSIVE =============== */
  @media (max-width: 1100px) {
    .hero-grid { grid-template-columns: 1fr; gap: 48px; }
    .hero-visual { height: 480px; }
    .showcase-grid { grid-template-columns: 1fr; gap: 48px; }
    .debug-body { grid-template-columns: 160px 1fr; }
  }
  @media (max-width: 720px) {
    .container { padding: 0 20px; }
    .nav-links { display: none; }
    .hero { padding: 56px 0 64px; }
    .hero-visual { height: 380px; }
    .hero-shot-back { width: 100%; right: 0; }
    .hero-shot-front { width: 90%; left: 0; }
    .hero-stream { display: none; }
    .showcase { padding: 64px 0; }
    .debug-body { grid-template-columns: 1fr; }
    .debug-tree { display: none; }
    .final-cta { padding: 72px 0; }
    footer .container { flex-direction: column; align-items: flex-start; gap: 16px; }
    .foot-links { margin-left: 0; flex-wrap: wrap; }
  }
</style>
