    fill="#38bdf8"
    points="
      23.8,11.5 24.8,14.1 28.8,13.7 28.8,18.3 24.8,17.9
      23.8,20.5 22.0,22.7 24.4,26.0 20.4,28.2 18.8,24.6
      16.0,25.0 13.2,24.6 11.6,28.2  7.6,26.0 10.0,22.7
